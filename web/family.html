<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guardian · Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">Guardian<span>Rahul's family view</span></div>
  <nav><a href="/">Pay app</a><a href="/family.html" class="on">Family dashboard</a><a href="/eval.html">Accuracy</a></nav>
</header>
<div class="wrap">
  <h2 id="headline">Nothing needs you right now</h2>
  <p class="lede">When Guardian pauses a payment from Amma's phone, it appears here first. You decide whether the money moves.</p>
  <button id="clear" class="quiet">Clear history</button>
  <div id="list"></div>
</div>
<script type="module">
const pct = (p) => `${Math.round((p ?? 0) * 100)}%`;
// The stamp follows the payment's life: Held → Blocked / Approved.
const stampFor = (i) => i.status === "blocked" ? ["Blocked", "hold"] : i.status === "approved" ? ["Approved", "allow"] : i.status === "expired" ? ["Expired", "warn"]
  : [{ hold: "Held", warn: "Check", allow: "Clear" }[i.verdict] ?? "Check", i.verdict ?? "warn"];
const where = (by = "") => (/web/i.test(by) ? "" : " in ChatGPT");
const STATUS = {
  approved: (i) => `You approved this payment${where(i.resolvedBy)}`,
  blocked: (i) => `You blocked this payment${where(i.resolvedBy)}`,
  expired: () => "Nobody decided in time, so it did not go through",
  warned: () => "Amma was warned before paying",
  allowed: () => "Went through normally",
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let items = [];

function render() {
  const waiting = items.filter((i) => i.status === "awaiting_family").length;
  document.getElementById("headline").textContent =
    waiting === 0 ? "Nothing needs you right now" : waiting === 1 ? "One payment is waiting for you" : `${waiting} payments are waiting for you`;
  document.getElementById("list").innerHTML = items.map((i) => `
    <article class="card">
      <span class="stamp ${stampFor(i)[1]}">${stampFor(i)[0]}</span>
      <div class="who">₹${Number(i.payment?.amount ?? 0).toLocaleString("en-IN")} to ${esc(i.payment?.payeeName || i.payment?.payeeId)}
        <small>${esc(i.payment?.payeeId)}, ${pct(i.probability)} chance of a scam (${esc(i.scamType === "unclear_pattern" ? "pattern not clear from signals alone" : String(i.scamType ?? "").replaceAll("_", " "))})</small>
        ${i.payment?.actor && i.payment.actor !== "ChatGPT user" ? `<small>Started by: ${esc(i.payment.actor)}</small>` : ""}</div>
      ${i.explanation ? `<div class="explain">${esc(i.explanation)}</div>` : ""}
      ${i.status === "awaiting_family"
        ? `<div class="actions"><button class="b-block" data-id="${i.id}" data-d="block">Block payment</button><button data-id="${i.id}" data-d="approve">Approve payment</button></div>`
        : `<p class="status ${esc(i.status)}">${STATUS[i.status]?.(i) ?? esc(i.status)}</p>`}
    </article>`).join("");
}

const isLocal = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
if (!isLocal) document.getElementById("clear").hidden = true;
document.getElementById("clear").addEventListener("click", () => fetch("/api/reset", { method: "POST" }).catch(() => {}));

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  b.disabled = true;
  try {
    const res = await fetch(`/api/payments/${b.dataset.id}/decision`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ decision: b.dataset.d }) });
    // 409 = already decided elsewhere (e.g. in ChatGPT): show the current state instead of an error.
    const body = await res.json().catch(() => ({}));
    // 200: our decision; 409: someone decided first (e.g. in ChatGPT). Either way show the server's truth.
    const truth = res.ok ? body : res.status === 409 ? body.item : null;
    if (!truth) throw new Error(body.error ?? `HTTP ${res.status}`);
    items = items.map((i) => (i.id === truth.id ? truth : i));
    render();
  } catch (err) {
    b.disabled = false;
    alert(`Couldn't save that decision: ${err.message}`);
  }
});

async function reload() {
  const data = await fetch("/api/payments").then((r) => r.json()).catch(() => null);
  if (Array.isArray(data)) { items = data; render(); }
}
const stream = new EventSource("/api/events");
stream.onopen = reload;
stream.onmessage = (e) => {
  const item = JSON.parse(e.data);
  if (item.reset) { items = []; return render(); }
  if (item.status === "expired") items = items.filter((i) => i.id !== item.id);
  else items = [item, ...items.filter((i) => i.id !== item.id)].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  render();
};
render();
</script>
</body>
</html>
